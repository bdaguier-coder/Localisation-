name: Check Pages setup
on:
  push:
    paths:
      - .github/workflows/check-pages.yml
permissions:
  contents: read
  pages: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages --jq '{url, status, source, build_type}'
